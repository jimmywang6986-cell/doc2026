<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>装机模拟器 3D · 星海电脑维修部</title>
<style>
  :root{
    --bg:#05070b; --panel:rgba(9,14,20,0.88); --line:rgba(120,170,210,0.20);
    --txt:#e6eef7; --dim:#93a6bb; --acc:#4ad6ff; --acc2:#a48cff;
    --good:#5fe0a0; --warn:#ffb35c; --bad:#ff7a6a;
    --font:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font)}
  #gl{display:block;position:absolute;inset:0;cursor:crosshair}
  .hidden{display:none!important}
  .gone{opacity:0!important;pointer-events:none!important}
  b{color:#fff}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;user-select:none}
  #crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;
    border:2px solid rgba(255,255,255,.55);border-radius:50%;transition:.12s;
    box-shadow:0 0 6px rgba(0,0,0,.6)}
  #crosshair::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;
    background:rgba(255,255,255,.9);border-radius:50%}
  #crosshair.hover{border-color:rgba(255,255,255,.9);transform:scale(1.1)}
  #crosshair.active{border-color:var(--acc);box-shadow:0 0 14px rgba(74,214,255,.85);transform:scale(1.25)}
  #crosshair.blocked{border-color:var(--bad);box-shadow:0 0 14px rgba(255,122,106,.8);transform:scale(1.15)}

  #prompt{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 18px;font-size:15px;line-height:1.5;text-align:center;max-width:620px;
    backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #prompt .sub{display:block;color:var(--dim);font-size:13px;margin-top:3px}
  #prompt .warn{color:var(--warn)}

  #objective{position:absolute;left:22px;top:20px;width:340px;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:12px 14px;
    backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
  #objChapter{font-size:12px;color:var(--acc);letter-spacing:.08em;margin-bottom:6px}
  #objTask{font-size:16px;font-weight:bold;line-height:1.4}
  #objHint{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5}
  .barwrap{margin-top:10px;height:5px;background:rgba(255,255,255,.10);border-radius:3px;overflow:hidden}
  #objBar{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .35s}
  #objCount{font-size:11px;color:var(--dim);margin-top:5px;text-align:right}

  #compass{position:absolute;top:52%;transform:translateX(-50%);text-align:center;transition:left .08s linear}
  #compass .arrow{width:0;height:0;margin:0 auto;border-left:7px solid transparent;border-right:7px solid transparent;
    border-top:10px solid var(--acc);filter:drop-shadow(0 0 6px rgba(74,214,255,.9));animation:bob 1.3s ease-in-out infinite}
  #compass .lbl{font-size:11.5px;color:#cfe6f5;background:rgba(6,12,18,.7);padding:2px 7px;border-radius:6px;margin-top:4px;white-space:nowrap}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  #held{position:absolute;right:22px;bottom:70px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:9px 14px;font-size:14px;backdrop-filter:blur(8px)}
  #held .k{color:var(--acc);font-size:11px;margin-right:8px;letter-spacing:.1em}
  #held .s{color:var(--dim);font-size:12px;margin-left:8px}

  #toasts{position:absolute;left:22px;bottom:26px;width:420px;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
    border-radius:8px;padding:9px 13px;font-size:13.5px;line-height:1.5;opacity:0;transform:translateX(-14px);
    transition:.3s;backdrop-filter:blur(8px)}
  .toast.in{opacity:1;transform:none}
  .toast.good{border-left-color:var(--good)}
  .toast.warn{border-left-color:var(--warn);color:#ffd9a8}

  #perf{position:absolute;right:22px;top:20px;font-size:11.5px;color:var(--dim);
    background:rgba(6,10,16,.55);padding:5px 9px;border-radius:6px}
  #keys{position:absolute;right:22px;bottom:24px;font-size:11.5px;color:var(--dim);
    background:rgba(6,10,16,.55);padding:6px 10px;border-radius:6px;max-width:380px;text-align:right;line-height:1.7}

  /* ---------- 对话 ---------- */
  #dialogue{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(820px,88vw);
    background:linear-gradient(180deg,rgba(8,13,20,.94),rgba(6,10,16,.97));border:1px solid var(--line);
    border-radius:14px;padding:20px 26px 22px;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.6);
    backdrop-filter:blur(10px);z-index:20}
  #dialogueWho{font-size:14px;font-weight:bold;color:var(--acc);margin-bottom:8px;letter-spacing:.05em}
  #dialogueText{font-size:17px;line-height:1.85;color:#eaf2fb}
  #dialogue::after{content:"点击或按 空格 继续 ▸";position:absolute;right:22px;bottom:8px;font-size:11px;color:var(--dim)}

  /* ---------- 弹窗 ---------- */
  #modal{position:absolute;inset:0;background:rgba(3,6,10,.72);display:flex;align-items:center;
    justify-content:center;z-index:30;backdrop-filter:blur(4px)}
  .modal-body{width:min(860px,92vw);max-height:86vh;overflow:auto;background:linear-gradient(180deg,#0b1119,#080d14);
    border:1px solid var(--line);border-radius:16px;padding:26px 30px 24px;box-shadow:0 30px 90px rgba(0,0,0,.7)}
  .card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
  .tag{background:rgba(74,214,255,.14);color:var(--acc);border:1px solid rgba(74,214,255,.35);
    font-size:11.5px;padding:4px 9px;border-radius:6px;white-space:nowrap;margin-top:4px}
  .tag.alt{background:rgba(164,140,255,.14);color:var(--acc2);border-color:rgba(164,140,255,.35)}
  .tag.good{background:rgba(95,224,160,.14);color:var(--good);border-color:rgba(95,224,160,.35)}
  .modal-body h2{font-size:24px;line-height:1.35}
  .modal-body h2 small{display:block;font-size:13px;color:var(--dim);font-weight:normal;margin-top:4px}
  .modal-body h3{font-size:14px;color:var(--acc);margin:0 0 8px;letter-spacing:.04em}
  .body{font-size:15px;line-height:1.9;color:#d7e2ee}
  .cols{display:grid;grid-template-columns:1fr 1.25fr;gap:24px;margin:6px 0 4px}
  .spec{list-style:none;font-size:13.5px;line-height:1.95;color:#c3d2e2}
  .spec li{padding-left:14px;position:relative}
  .spec li::before{content:"·";position:absolute;left:2px;color:var(--acc)}
  .tips{margin-top:18px;background:rgba(74,214,255,.06);border:1px solid rgba(74,214,255,.18);
    border-radius:10px;padding:14px 16px}
  .tips ul{list-style:none;font-size:13.5px;line-height:1.9;color:#cfdcea}
  .tips li{padding-left:16px;position:relative;margin-bottom:2px}
  .tips li::before{content:"▸";position:absolute;left:0;color:var(--acc)}
  .foot{margin-top:22px;display:flex;gap:12px;justify-content:flex-end}
  .foot.col{flex-direction:column;align-items:stretch}
  .btn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--txt);
    font-family:var(--font);font-size:14px;padding:10px 20px;border-radius:9px;cursor:pointer;transition:.15s}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.primary{background:linear-gradient(180deg,#1a90d8,#1470b0);border-color:#2fa8e8;color:#fff;font-weight:bold}
  .btn.primary:hover{filter:brightness(1.12)}
  .btn.good{background:rgba(95,224,160,.18);border-color:rgba(95,224,160,.5);color:var(--good)}
  .btn.danger{background:rgba(255,122,106,.12);border-color:rgba(255,122,106,.4);color:#ffb0a4}
  .dim{color:var(--dim)}
  .jr{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .chap h3{color:#dfe9f4;font-size:14.5px;margin-bottom:6px}
  .chap ul{list-style:none;font-size:13px;line-height:1.85}
  .chap li.done{color:var(--good)}
  .chap li.avail{color:#fff}
  .chap li.lock{color:#67788c}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:rgba(164,140,255,.12);border:1px solid rgba(164,140,255,.3);color:#d6cbff;
    font-size:12px;padding:4px 9px;border-radius:20px}
  .bios-row,.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
  .set-row input[type=range]{flex:1;max-width:280px;accent-color:var(--acc)}
  .report{margin-top:14px}
  .rrow{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14.5px}
  .rrow b{color:var(--acc)}

  /* ---------- 标题 / 加载 ---------- */
  .screen{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#0e1a26,#05070b 70%);transition:opacity .6s}
  #title{flex-direction:column;text-align:center;padding:30px}
  #title h1{font-size:min(62px,9vw);letter-spacing:.08em;
    background:linear-gradient(180deg,#fff,#7fd2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #title .sub{color:var(--acc);font-size:15px;letter-spacing:.32em;margin:14px 0 26px}
  #title .story{max-width:620px;font-size:14.5px;line-height:2;color:#b8c8da;margin-bottom:30px}
  #title .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  #title .meta{margin-top:34px;font-size:12px;color:#5d6f83;line-height:1.9}
  #loading{flex-direction:column;gap:18px}
  #loading .ring{width:44px;height:44px;border:3px solid rgba(74,214,255,.2);border-top-color:var(--acc);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadingText{font-size:14px;color:var(--dim);text-align:center;line-height:1.8;max-width:540px}
  @media (max-width:760px){
    #objective{width:250px}#toasts{width:260px}#keys{display:none}.cols{grid-template-columns:1fr}.jr{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="crosshair"></div>
  <div id="objective">
    <div id="objChapter">第一章</div>
    <div id="objTask">…</div>
    <div id="objHint"></div>
    <div class="barwrap"><div id="objBar"></div></div>
    <div id="objCount">0 / 0</div>
  </div>
  <div id="compass" class="hidden"></div>
  <div id="prompt" class="hidden"></div>
  <div id="held" class="hidden"></div>
  <div id="toasts"></div>
  <div id="perf"></div>
  <div id="keys"></div>
</div>

<div id="dialogue" class="hidden">
  <div id="dialogueWho"></div>
  <div id="dialogueText"></div>
</div>

<div id="modal" class="hidden"><div id="modalBody" class="modal-body"></div></div>

<div id="title" class="screen">
  <h1>装机模拟器 3D</h1>
  <div class="sub">星 海 电 脑 维 修 部</div>
  <p class="story">
    爷爷留下一家老店、一把黄铜钥匙，和一本卷了边的《装机手记》。<br>
    柜台上还压着最后一张未完成的订单——一台给高一女生的编程竞赛主机。<br>
    第一人称走进店里，从认识零件开始，把这台机器一颗螺丝一根线地装起来、点亮它。
  </p>
  <div class="btns">
    <button class="btn primary" id="btnStart">开始装机（点击画面锁定鼠标）</button>
    <button class="btn" id="btnHelp">操作说明</button>
    <button class="btn" id="btnSettings">画质设置</button>
  </div>
  <div class="meta">
    WASD 移动 · 鼠标环视 · E 交互 · F 查看零件资料 · Q 放回 · Tab 手册 · Esc 暂停<br>
    纯 WebGL2 实时渲染 · 22 个真实装机步骤 · 30+ 张硬件知识卡片
  </div>
</div>

<div id="loading" class="screen">
  <div class="ring"></div>
  <div id="loadingText">正在加载…</div>
</div>

<script src="src/00-math.js"></script>
<script src="src/01-gl.js"></script>
<script src="src/02-textures.js"></script>
<script src="src/03-geom.js"></script>
<script src="src/04-render.js"></script>
<script src="src/05-scene.js"></script>
<script src="src/06-player.js"></script>
<script src="src/07-models-room.js"></script>
<script src="src/08-models-hw.js"></script>
<script src="src/09-labels.js"></script>
<script src="src/10-modelreg.js"></script>
<script src="src/11-parts.js"></script>
<script src="src/12-world.js"></script>
<script src="src/13-screens.js"></script>
<script src="src/14-audio.js"></script>
<script src="src/15-ui.js"></script>
<script src="src/16-game.js"></script>
</body>
</html>
