<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>装机模拟器 3D · 星海电脑维修部</title>
<style>
  :root{
    --bg:#05070b; --panel:rgba(9,14,20,0.88); --line:rgba(120,170,210,0.20);
    --txt:#e6eef7; --dim:#93a6bb; --acc:#4ad6ff; --acc2:#a48cff;
    --good:#5fe0a0; --warn:#ffb35c; --bad:#ff7a6a;
    --font:"WenQuanYi Micro Hei","Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font)}
  #gl{display:block;position:absolute;inset:0;cursor:crosshair}
  .hidden{display:none!important}
  .gone{opacity:0!important;pointer-events:none!important}
  b{color:#fff}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;user-select:none}
  #crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;
    border:2px solid rgba(255,255,255,.55);border-radius:50%;transition:.12s;
    box-shadow:0 0 6px rgba(0,0,0,.6)}
  #crosshair::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;
    background:rgba(255,255,255,.9);border-radius:50%}
  #crosshair.hover{border-color:rgba(255,255,255,.9);transform:scale(1.1)}
  #crosshair.active{border-color:var(--acc);box-shadow:0 0 14px rgba(74,214,255,.85);transform:scale(1.25)}
  #crosshair.blocked{border-color:var(--bad);box-shadow:0 0 14px rgba(255,122,106,.8);transform:scale(1.15)}

  #prompt{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 18px;font-size:15px;line-height:1.5;text-align:center;max-width:620px;
    backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #prompt .sub{display:block;color:var(--dim);font-size:13px;margin-top:3px}
  #prompt .warn{color:var(--warn)}

  #objective{position:absolute;left:22px;top:20px;width:340px;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:12px 14px;
    backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
  #objChapter{font-size:12px;color:var(--acc);letter-spacing:.08em;margin-bottom:6px}
  #objTask{font-size:16px;font-weight:bold;line-height:1.4}
  #objHint{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5}
  .barwrap{margin-top:10px;height:5px;background:rgba(255,255,255,.10);border-radius:3px;overflow:hidden}
  #objBar{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .35s}
  #objCount{font-size:11px;color:var(--dim);margin-top:5px;text-align:right}

  #compass{position:absolute;top:52%;transform:translateX(-50%);text-align:center;transition:left .08s linear}
  #compass .arrow{width:0;height:0;margin:0 auto;border-left:7px solid transparent;border-right:7px solid transparent;
    border-top:10px solid var(--acc);filter:drop-shadow(0 0 6px rgba(74,214,255,.9));animation:bob 1.3s ease-in-out infinite}
  #compass .lbl{font-size:11.5px;color:#cfe6f5;background:rgba(6,12,18,.7);padding:2px 7px;border-radius:6px;margin-top:4px;white-space:nowrap}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  #held{position:absolute;right:22px;bottom:70px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:9px 14px;font-size:14px;backdrop-filter:blur(8px)}
  #held .k{color:var(--acc);font-size:11px;margin-right:8px;letter-spacing:.1em}
  #held .s{color:var(--dim);font-size:12px;margin-left:8px}

  #toasts{position:absolute;left:22px;bottom:26px;width:420px;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
    border-radius:8px;padding:9px 13px;font-size:13.5px;line-height:1.5;opacity:0;transform:translateX(-14px);
    transition:.3s;backdrop-filter:blur(8px)}
  .toast.in{opacity:1;transform:none}
  .toast.good{border-left-color:var(--good)}
  .toast.warn{border-left-color:var(--warn);color:#ffd9a8}

  #perf{position:absolute;right:22px;top:20px;font-size:11.5px;color:var(--dim);
    background:rgba(6,10,16,.55);padding:5px 9px;border-radius:6px}
  #keys{position:absolute;right:22px;bottom:24px;font-size:11.5px;color:var(--dim);
    background:rgba(6,10,16,.55);padding:6px 10px;border-radius:6px;max-width:380px;text-align:right;line-height:1.7}

  /* ---------- 对话 ---------- */
  #dialogue{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(820px,88vw);
    background:linear-gradient(180deg,rgba(8,13,20,.94),rgba(6,10,16,.97));border:1px solid var(--line);
    border-radius:14px;padding:20px 26px 22px;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.6);
    backdrop-filter:blur(10px);z-index:20}
  #dialogueWho{font-size:14px;font-weight:bold;color:var(--acc);margin-bottom:8px;letter-spacing:.05em}
  #dialogueText{font-size:17px;line-height:1.85;color:#eaf2fb}
  #dialogue::after{content:"点击或按 空格 继续 ▸";position:absolute;right:22px;bottom:8px;font-size:11px;color:var(--dim)}

  /* ---------- 弹窗 ---------- */
  #modal{position:absolute;inset:0;background:rgba(3,6,10,.72);display:flex;align-items:center;
    justify-content:center;z-index:30;backdrop-filter:blur(4px)}
  .modal-body{width:min(860px,92vw);max-height:86vh;overflow:auto;background:linear-gradient(180deg,#0b1119,#080d14);
    border:1px solid var(--line);border-radius:16px;padding:26px 30px 24px;box-shadow:0 30px 90px rgba(0,0,0,.7)}
  .card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
  .tag{background:rgba(74,214,255,.14);color:var(--acc);border:1px solid rgba(74,214,255,.35);
    font-size:11.5px;padding:4px 9px;border-radius:6px;white-space:nowrap;margin-top:4px}
  .tag.alt{background:rgba(164,140,255,.14);color:var(--acc2);border-color:rgba(164,140,255,.35)}
  .tag.good{background:rgba(95,224,160,.14);color:var(--good);border-color:rgba(95,224,160,.35)}
  .modal-body h2{font-size:24px;line-height:1.35}
  .modal-body h2 small{display:block;font-size:13px;color:var(--dim);font-weight:normal;margin-top:4px}
  .modal-body h3{font-size:14px;color:var(--acc);margin:0 0 8px;letter-spacing:.04em}
  .body{font-size:15px;line-height:1.9;color:#d7e2ee}
  .cols{display:grid;grid-template-columns:1fr 1.25fr;gap:24px;margin:6px 0 4px}
  .spec{list-style:none;font-size:13.5px;line-height:1.95;color:#c3d2e2}
  .spec li{padding-left:14px;position:relative}
  .spec li::before{content:"·";position:absolute;left:2px;color:var(--acc)}
  .tips{margin-top:18px;background:rgba(74,214,255,.06);border:1px solid rgba(74,214,255,.18);
    border-radius:10px;padding:14px 16px}
  .tips ul{list-style:none;font-size:13.5px;line-height:1.9;color:#cfdcea}
  .tips li{padding-left:16px;position:relative;margin-bottom:2px}
  .tips li::before{content:"▸";position:absolute;left:0;color:var(--acc)}
  .foot{margin-top:22px;display:flex;gap:12px;justify-content:flex-end}
  .foot.col{flex-direction:column;align-items:stretch}
  .btn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--txt);
    font-family:var(--font);font-size:14px;padding:10px 20px;border-radius:9px;cursor:pointer;transition:.15s}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.primary{background:linear-gradient(180deg,#1a90d8,#1470b0);border-color:#2fa8e8;color:#fff;font-weight:bold}
  .btn.primary:hover{filter:brightness(1.12)}
  .btn.good{background:rgba(95,224,160,.18);border-color:rgba(95,224,160,.5);color:var(--good)}
  .btn.danger{background:rgba(255,122,106,.12);border-color:rgba(255,122,106,.4);color:#ffb0a4}
  .dim{color:var(--dim)}
  .jr{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .chap h3{color:#dfe9f4;font-size:14.5px;margin-bottom:6px}
  .chap ul{list-style:none;font-size:13px;line-height:1.85}
  .chap li.done{color:var(--good)}
  .chap li.avail{color:#fff}
  .chap li.lock{color:#67788c}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:rgba(164,140,255,.12);border:1px solid rgba(164,140,255,.3);color:#d6cbff;
    font-size:12px;padding:4px 9px;border-radius:20px}
  .bios-row,.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
  .set-row input[type=range]{flex:1;max-width:280px;accent-color:var(--acc)}
  .report{margin-top:14px}
  .rrow{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14.5px}
  .rrow b{color:var(--acc)}

  /* ---------- 标题 / 加载 ---------- */
  .screen{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#0e1a26,#05070b 70%);transition:opacity .6s}
  #title{flex-direction:column;text-align:center;padding:30px}
  #title h1{font-size:min(62px,9vw);letter-spacing:.08em;
    background:linear-gradient(180deg,#fff,#7fd2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #title .sub{color:var(--acc);font-size:15px;letter-spacing:.32em;margin:14px 0 26px}
  #title .story{max-width:620px;font-size:14.5px;line-height:2;color:#b8c8da;margin-bottom:30px}
  #title .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  #title .meta{margin-top:34px;font-size:12px;color:#5d6f83;line-height:1.9}
  #loading{flex-direction:column;gap:18px}
  #loading .ring{width:44px;height:44px;border:3px solid rgba(74,214,255,.2);border-top-color:var(--acc);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadingText{font-size:14px;color:var(--dim);text-align:center;line-height:1.8;max-width:540px}
  @media (max-width:760px){
    #objective{width:250px}#toasts{width:260px}#keys{display:none}.cols{grid-template-columns:1fr}.jr{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="crosshair"></div>
  <div id="objective">
    <div id="objChapter">第一章</div>
    <div id="objTask">…</div>
    <div id="objHint"></div>
    <div class="barwrap"><div id="objBar"></div></div>
    <div id="objCount">0 / 0</div>
  </div>
  <div id="compass" class="hidden"></div>
  <div id="prompt" class="hidden"></div>
  <div id="held" class="hidden"></div>
  <div id="toasts"></div>
  <div id="perf"></div>
  <div id="keys"></div>
</div>

<div id="dialogue" class="hidden">
  <div id="dialogueWho"></div>
  <div id="dialogueText"></div>
</div>

<div id="modal" class="hidden"><div id="modalBody" class="modal-body"></div></div>

<div id="title" class="screen">
  <h1>装机模拟器 3D</h1>
  <div class="sub">星 海 电 脑 维 修 部</div>
  <p class="story">
    爷爷留下一家老店、一把黄铜钥匙，和一本卷了边的《装机手记》。<br>
    柜台上还压着最后一张未完成的订单——一台给高一女生的编程竞赛主机。<br>
    第一人称走进店里，从认识零件开始，把这台机器一颗螺丝一根线地装起来、点亮它。
  </p>
  <div class="btns">
    <button class="btn primary" id="btnStart">开始装机（点击画面锁定鼠标）</button>
    <button class="btn" id="btnHelp">操作说明</button>
    <button class="btn" id="btnSettings">画质设置</button>
  </div>
  <div class="meta">
    WASD 移动 · 鼠标环视 · E 交互 · F 查看零件资料 · Q 放回 · Tab 手册 · Esc 暂停<br>
    纯 WebGL2 实时渲染 · 22 个真实装机步骤 · 30+ 张硬件知识卡片
  </div>
</div>

<div id="loading" class="screen">
  <div class="ring"></div>
  <div id="loadingText">正在加载…</div>
</div>
<script>

/* ==================== src/00-math.js ==================== */
/* 数学库：列主序 4x4 矩阵与向量运算 */
(function (root) {
  'use strict';

  const V3 = {
    set: (o, x, y, z) => { o[0] = x; o[1] = y; o[2] = z; return o; },
    copy: (o, a) => V3.set(o, a[0], a[1], a[2]),
    add: (o, a, b) => V3.set(o, a[0] + b[0], a[1] + b[1], a[2] + b[2]),
    sub: (o, a, b) => V3.set(o, a[0] - b[0], a[1] - b[1], a[2] - b[2]),
    scale: (o, a, s) => V3.set(o, a[0] * s, a[1] * s, a[2] * s),
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    len: (a) => Math.hypot(a[0], a[1], a[2]),
    dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
    cross: (o, a, b) => V3.set(o,
      a[1] * b[2] - a[2] * b[1],
      a[2] * b[0] - a[0] * b[2],
      a[0] * b[1] - a[1] * b[0]),
    norm: (o, a) => {
      const l = Math.hypot(a[0], a[1], a[2]) || 1;
      return V3.set(o, a[0] / l, a[1] / l, a[2] / l);
    },
    lerp: (o, a, b, t) => V3.set(o,
      a[0] + (b[0] - a[0]) * t,
      a[1] + (b[1] - a[1]) * t,
      a[2] + (b[2] - a[2]) * t),
  };

  const M4 = {
    create() {
      const m = new Float32Array(16);
      m[0] = m[5] = m[10] = m[15] = 1;
      return m;
    },
    identity(o) {
      o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o;
    },
    copy(o, a) { o.set(a); return o; },
    /** o = a * b （先应用 b 的变换，再应用 a） */
    mul(o, a, b) {
      const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
      const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
      const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
      const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
      for (let i = 0; i < 4; i++) {
        const b0 = b[i * 4], b1 = b[i * 4 + 1], b2 = b[i * 4 + 2], b3 = b[i * 4 + 3];
        o[i * 4] = b0 * a00 + b1 * a10 + b2 * a20 + b3 * a30;
        o[i * 4 + 1] = b0 * a01 + b1 * a11 + b2 * a21 + b3 * a31;
        o[i * 4 + 2] = b0 * a02 + b1 * a12 + b2 * a22 + b3 * a32;
        o[i * 4 + 3] = b0 * a03 + b1 * a13 + b2 * a23 + b3 * a33;
      }
      return o;
    },
    /** 平移-旋转(Z*Y*X)-缩放 组合 */
    fromTRS(o, p, r, s) {
      const sx = Math.sin(r[0]), cx = Math.cos(r[0]);
      const sy = Math.sin(r[1]), cy = Math.cos(r[1]);
      const sz = Math.sin(r[2]), cz = Math.cos(r[2]);
      const scx = s ? s[0] : 1, scy = s ? s[1] : 1, scz = s ? s[2] : 1;
      // R = Ry * Rx * Rz
      const m00 = cy * cz + sy * sx * sz;
      const m01 = cx * sz;
      const m02 = -sy * cz + cy * sx * sz;
      const m10 = -cy * sz + sy * sx * cz;
      const m11 = cx * cz;
      const m12 = sy * sz + cy * sx * cz;
      const m20 = sy * cx;
      const m21 = -sx;
      const m22 = cy * cx;
      o[0] = m00 * scx; o[1] = m01 * scx; o[2] = m02 * scx; o[3] = 0;
      o[4] = m10 * scy; o[5] = m11 * scy; o[6] = m12 * scy; o[7] = 0;
      o[8] = m20 * scz; o[9] = m21 * scz; o[10] = m22 * scz; o[11] = 0;
      o[12] = p[0]; o[13] = p[1]; o[14] = p[2]; o[15] = 1;
      return o;
    },
    perspective(o, fovy, aspect, near, far) {
      const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
      o.fill(0);
      o[0] = f / aspect; o[5] = f; o[10] = (far + near) * nf;
      o[11] = -1; o[14] = 2 * far * near * nf;
      return o;
    },
    ortho(o, l, r, b, t, n, f) {
      o.fill(0);
      o[0] = 2 / (r - l); o[5] = 2 / (t - b); o[10] = -2 / (f - n);
      o[12] = -(r + l) / (r - l); o[13] = -(t + b) / (t - b);
      o[14] = -(f + n) / (f - n); o[15] = 1;
      return o;
    },
    lookAt(o, eye, center, up) {
      const z = V3.norm([0, 0, 0], V3.sub([0, 0, 0], eye, center));
      const x = V3.norm([0, 0, 0], V3.cross([0, 0, 0], up, z));
      const y = V3.cross([0, 0, 0], z, x);
      o[0] = x[0]; o[1] = y[0]; o[2] = z[0]; o[3] = 0;
      o[4] = x[1]; o[5] = y[1]; o[6] = z[1]; o[7] = 0;
      o[8] = x[2]; o[9] = y[2]; o[10] = z[2]; o[11] = 0;
      o[12] = -V3.dot(x, eye); o[13] = -V3.dot(y, eye); o[14] = -V3.dot(z, eye); o[15] = 1;
      return o;
    },
    invert(o, a) {
      const b00 = a[0] * a[5] - a[1] * a[4], b01 = a[0] * a[6] - a[2] * a[4];
      const b02 = a[0] * a[7] - a[3] * a[4], b03 = a[1] * a[6] - a[2] * a[5];
      const b04 = a[1] * a[7] - a[3] * a[5], b05 = a[2] * a[7] - a[3] * a[6];
      const b06 = a[8] * a[13] - a[9] * a[12], b07 = a[8] * a[14] - a[10] * a[12];
      const b08 = a[8] * a[15] - a[11] * a[12], b09 = a[9] * a[14] - a[10] * a[13];
      const b10 = a[9] * a[15] - a[11] * a[13], b11 = a[10] * a[15] - a[11] * a[14];
      let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
      if (!det) return M4.identity(o);
      det = 1 / det;
      const r = [
        (a[5] * b11 - a[6] * b10 + a[7] * b09) * det,
        (a[2] * b10 - a[1] * b11 - a[3] * b09) * det,
        (a[13] * b05 - a[14] * b04 + a[15] * b03) * det,
        (a[10] * b04 - a[9] * b05 - a[11] * b03) * det,
        (a[6] * b08 - a[4] * b11 - a[7] * b07) * det,
        (a[0] * b11 - a[2] * b08 + a[3] * b07) * det,
        (a[14] * b02 - a[12] * b05 - a[15] * b01) * det,
        (a[8] * b05 - a[10] * b02 + a[11] * b01) * det,
        (a[4] * b10 - a[5] * b08 + a[7] * b06) * det,
        (a[1] * b08 - a[0] * b10 - a[3] * b06) * det,
        (a[12] * b04 - a[13] * b02 + a[15] * b00) * det,
        (a[9] * b02 - a[8] * b04 - a[11] * b00) * det,
        (a[5] * b07 - a[4] * b09 - a[6] * b06) * det,
        (a[0] * b09 - a[1] * b07 + a[2] * b06) * det,
        (a[13] * b01 - a[12] * b03 - a[14] * b00) * det,
        (a[8] * b03 - a[9] * b01 + a[10] * b00) * det,
      ];
      o.set(r);
      return o;
    },
    /** 取左上 3x3 的逆转置，用于法线变换 */
    normalMat(o3, m) {
      const inv = M4.invert(M4.create(), m);
      o3[0] = inv[0]; o3[1] = inv[4]; o3[2] = inv[8];

/* WebGL2 底层封装：着色器、纹理、帧缓冲、顶点数组 */
(function (root) {
  'use strict';

  /** 顶点布局（交错）：位置3 + 法线3 + UV2 + 颜色3 + 材质3(粗糙度/金属度/自发光) */
  const STRIDE_F = 14;
  const STRIDE_B = STRIDE_F * 4;

  function compile(gl, type, src, tag) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      console.error('[shader] ' + tag + '\n' + log + '\n' + withLines(src));
      throw new Error('着色器编译失败: ' + tag + ' -> ' + log);
    }
    return sh;
  }

  function withLines(src) {
    return src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n');
  }

  function program(gl, vsSrc, fsSrc, tag) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vsSrc, tag + '.vert'));
    gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fsSrc, tag + '.frag'));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error('着色器链接失败: ' + tag + ' -> ' + gl.getProgramInfoLog(p));
    }
    const cache = new Map();
    return {
      prog: p,
      use() { gl.useProgram(p); return this; },
      loc(name) {
        if (!cache.has(name)) cache.set(name, gl.getUniformLocation(p, name));
        return cache.get(name);
      },
      u1i(n, v) { gl.uniform1i(this.loc(n), v); },
      u1f(n, v) { gl.uniform1f(this.loc(n), v); },
      u2f(n, a, b) { gl.uniform2f(this.loc(n), a, b); },
      u3f(n, a, b, c) { gl.uniform3f(this.loc(n), a, b, c); },
      u3v(n, v) { gl.uniform3fv(this.loc(n), v); },
      u4f(n, a, b, c, d) { gl.uniform4f(this.loc(n), a, b, c, d); },
      um4(n, v) { gl.uniformMatrix4fv(this.loc(n), false, v); },

    gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
    const ebo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

    for (const [loc, size, off] of layout) {
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, STRIDE_B, off * 4);

    gl.bindVertexArray(null);

    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, opts.srgb === false ? gl.RGBA : gl.SRGB8_ALPHA8,
      gl.RGBA, gl.UNSIGNED_BYTE, canvas);

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

      tex: t,

        gl.bindTexture(gl.TEXTURE_2D, t);

    const color = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, color);
    gl.texImage2D(gl.TEXTURE_2D, 0, fmt, w, h, 0, gl.RGBA, type, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, color, 0);

    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.DEPTH_COMPONENT24, size, size, 0,

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fbo, tex, size };
  }

  /** 全屏三角形，用于后处理 */
  function fullscreenQuad(gl) {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    return vao;
  }

  root.GLU = {
    STRIDE_F, STRIDE_B, program, makeVAO, texFromCanvas, dynamicTex,
    makeFBO, makeShadowFBO, fullscreenQuad,
  };
})(window);

/* 程序化纹理：噪声基底 + Canvas 绘制细节 + 由高度图生成法线贴图 */
(function (root) {
  'use strict';

  const { clamp } = root.MATH3D;

  function hash2(ix, iy, seed, period) {
    let x = ((ix % period) + period) % period;
    let y = ((iy % period) + period) % period;
    let n = (x * 1619 + y * 31337 + seed * 6971) | 0;
    n = (n << 13) ^ n;
    return 1 - ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824;
  }

  function vnoise(x, y, seed, period) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = hash2(ix, iy, seed, period);
    const b = hash2(ix + 1, iy, seed, period);
    const c = hash2(ix, iy + 1, seed, period);
    const d = hash2(ix + 1, iy + 1, seed, period);
    return (a + (b - a) * ux) * (1 - uy) + (c + (d - c) * ux) * uy;

  /** 可平铺的分形噪声，返回 0..1 */

    for (let o = 0; o < octaves; o++) {
      sum += amp * vnoise(u * f, v * f, seed + o * 17, f);
      norm += amp;
      amp *= 0.5;
      f *= 2;

    return clamp(0.5 + 0.5 * (sum / norm), 0, 1);

    const c = document.createElement('canvas');
    c.width = c.height = size;

  function build(size, pixelFn, ctxFn) {
    const canvas = newCanvas(size);
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(size, size);
    const height = new Float32Array(size * size);

      for (let x = 0; x < size; x++) {

        img.data[i + 1] = clamp(o[1], 0, 1) * 255;
        img.data[i + 2] = clamp(o[2], 0, 1) * 255;
        img.data[i + 3] = 255;
        height[y * size + x] = o.length > 3 ? o[3] : 0.5;

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {

        const dy = (at(x, y + 1) - at(x, y - 1)) * strength;

        img.data[i] = (nx * 0.5 + 0.5) * 255;
        img.data[i + 1] = (ny * 0.5 + 0.5) * 255;
        img.data[i + 2] = (nz * 0.5 + 0.5) * 255;
        img.data[i + 3] = 255;

    ctx.putImageData(img, 0, 0);

    concrete: () => build(256, (u, v) => {
      const n = fbm(u, v, 8, 5, 3);
      const spots = fbm(u, v, 3, 3, 91);
      const g = 0.30 + n * 0.20 - (spots < 0.34 ? 0.07 : 0);

        ctx.moveTo(Math.random() * s, 0);

    pcb: () => build(512, (u, v) => {

      }
    }),

    steel: () => build(256, (u, v) => {
      const brush = fbm(u * 30, v * 0.5, 20, 3, 61);
      const g = 0.42 + brush * 0.16;
      return [g, g * 1.005, g * 1.02, brush];
    }),

    alu: () => build(256, (u, v, x) => {
      const line = 0.85 + 0.15 * Math.sin(x * 1.6);
      const n = fbm(u, v, 26, 2, 71);

    plasticDark: () => build(256, (u, v) => {

})(window);

    ny: { n: [0, -1, 0], u: 'x', v: 'z', sign: -1 },
    pz: { n: [0, 0, 1], u: 'x', v: 'y', sign: 1 },

      this.stack = [M4.identity(M4.create())];
      this.min = [1e9, 1e9, 1e9];
      this.max = [-1e9, -1e9, -1e9];
    }

    get mat() { return this.stack[this.stack.length - 1]; }

    push(m) {
      this.stack.push(M4.mul(M4.create(), this.mat, m));
      return this;
    }

    pushTRS(pos, rot, scale) {
      return this.push(M4.fromTRS(M4.create(), pos || [0, 0, 0], rot || [0, 0, 0], scale || [1, 1, 1]));

          tex, transparent: !!o.transparent, noShadow: !!o.noShadow,
          alpha: o.alpha != null ? o.alpha : 1,
          verts: [], idx: [], n: 0,
        };
        this.groups.set(key, g);
      }

    vert(g, p, n, uv, o) {

      const c = o.color || [1, 1, 1];

        wn[0], wn[1], wn[2],
        uv[0], uv[1],

        o.metal != null ? o.metal : 0,
        o.emis != null ? o.emis : 0,

      const b = this.vert(g, p1, n, uvs[1], o);
      const c = this.vert(g, p2, n, uvs[2], o);

      }
      for (let i = 0; i < rings; i++) {
        for (let j = 0; j < segs; j++) {
          g.idx.push(grid[i][j], grid[i + 1][j], grid[i + 1][j + 1]);
          g.idx.push(grid[i][j], grid[i + 1][j + 1], grid[i][j + 1]);
        }
      }
      return this;
    }

    /** 沿折线生成管道（线材） */
    tube(o) {

        const side = V3.norm([0, 0, 0], V3.cross([0, 0, 0], dir, up));
        const up2 = V3.norm([0, 0, 0], V3.cross([0, 0, 0], side, dir));
        const ring = [];
        for (let j = 0; j <= sides; j++) {
          const a = (j / sides) * Math.PI * 2;
          const nx = side[0] * Math.cos(a) + up2[0] * Math.sin(a);
          const ny = side[1] * Math.cos(a) + up2[1] * Math.sin(a);
          const nz = side[2] * Math.cos(a) + up2[2] * Math.sin(a);
          ring.push(this.vert(g, [p[0] + nx * r, p[1] + ny * r, p[2] + nz * r], [nx, ny, nz],
            [j / sides * 2, i * 0.5], o));
        }
        rings.push(ring);
      }
      for (let i = 0; i < rings.length - 1; i++) {
        for (let j = 0; j < sides; j++) {
          g.idx.push(rings[i][j], rings[i + 1][j], rings[i + 1][j + 1]);
          g.idx.push(rings[i][j], rings[i + 1][j + 1], rings[i][j + 1]);
        }
      }
      return this;
    }

    /** 复制另一个构建器的内容（在当前变换下） */
    build(gl) {
      const subs = [];
      for (const g of this.groups.values()) {
        if (!g.idx.length) continue;

          alpha: g.alpha, vao: mesh.vao, count: mesh.count,

      subs.sort((a, b) => (a.transparent ? 1 : 0) - (b.transparent ? 1 : 0));
      return {
        subs,
        bbox: { min: this.min.slice(), max: this.max.slice() },
        size: [this.max[0] - this.min[0], this.max[1] - this.min[1], this.max[2] - this.min[2]],
      };
    }
  }

  /** 三次贝塞尔采样，用于线材走线 */
  function bezier(p0, p1, p2, p3, steps) {
    const out = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, mt = 1 - t;
      const a = mt * mt * mt, b = 3 * mt * mt * t, c = 3 * mt * t * t, d = t * t * t;
      out.push([
        a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0],
        a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1],
        a * p0[2] + b * p1[2] + c * p2[2] + d * p3[2],
      ]);
    }
    return out;
  }

  float lSW = lum(texture(uTex, vUV + vec2(-1.0, 1.0)*uInvRes).rgb);
  float lSE = lum(texture(uTex, vUV + vec2( 1.0, 1.0)*uInvRes).rgb);
  float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE)));
  float lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
  vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), ((lNW + lSW) - (lNE + lSE)));
  float reduce = max((lNW+lNE+lSW+lSE)*0.25*0.25, 1.0/128.0);
  float rcp = 1.0/(min(abs(dir.x), abs(dir.y)) + reduce);
  dir = clamp(dir*rcp, -8.0, 8.0) * uInvRes;
  vec3 a = 0.5*(texture(uTex, vUV + dir*(1.0/3.0-0.5)).rgb + texture(uTex, vUV + dir*(2.0/3.0-0.5)).rgb);
  vec3 b = a*0.5 + 0.25*(texture(uTex, vUV - dir*0.5).rgb + texture(uTex, vUV + dir*0.5).rgb);
  float lB = lum(b);
  o = vec4((lB < lMin || lB > lMax) ? a : b, 1.0);
}`;

  const Renderer = {
    init(canvas) {
      const gl = canvas.getContext('webgl2', {
        antialias: false, alpha: false, depth: true, powerPreference: 'high-performance',
      });
      if (!gl) throw new Error('当前浏览器不支持 WebGL2');
      this.gl = gl;
      this.canvas = canvas;
      gl.getExtension('EXT_color_buffer_float');
      gl.getExtension('EXT_color_buffer_half_float');
      this.floatOK = !!gl.getExtension('EXT_color_buffer_half_float') || !!gl.getExtension('EXT_color_buffer_float');

      this.pMain = root.GLU.program(gl, VS_MAIN, FS_MAIN, 'main');
      this.pDepth = root.GLU.program(gl, VS_DEPTH, FS_DEPTH, 'depth');
      this.pBright = root.GLU.program(gl, VS_POST, FS_BRIGHT, 'bright');
      this.pBlur = root.GLU.program(gl, VS_POST, FS_BLUR, 'blur');
      this.pComp = root.GLU.program(gl, VS_POST, FS_COMPOSITE, 'composite');
      this.pFxaa = root.GLU.program(gl, VS_POST, FS_FXAA, 'fxaa');
      this.quad = root.GLU.fullscreenQuad(gl);

      this.shadow = root.GLU.makeShadowFBO(gl, 2048);
      this.shadowSize = 2048;
      this.shadowVP = M4.create();
      this.view = M4.create();
      this.proj = M4.create();
      this.nrm = new Float32Array(9);
      this.size = [0, 0];
      this.quality = { renderScale: 1, shadows: true, bloom: true, fxaa: true, maxLights: 8 };
      this.exposure = 1.0;
      this.flash = 0;
      this.desat = 0;
      gl.enable(gl.DEPTH_TEST);
      gl.enable(gl.CULL_FACE);
      gl.cullFace(gl.BACK);
    },

    setShadowSize(n) {
      if (this.shadowSize === n) return;
      const gl = this.gl;
      gl.deleteTexture(this.shadow.tex);
      gl.deleteFramebuffer(this.shadow.fbo);
      this.shadow = root.GLU.makeShadowFBO(gl, n);
      this.shadowSize = n;
    },

    resize(w, h) {
      const gl = this.gl;
      const scale = this.quality.renderScale;
      const rw = Math.max(320, Math.floor(w * scale));
      const rh = Math.max(200, Math.floor(h * scale));
      if (this.size[0] === rw && this.size[1] === rh) return;
      this.size = [rw, rh];
      const del = (f) => {
        if (!f) return;
        gl.deleteTexture(f.color);
        if (f.depth) gl.deleteRenderbuffer(f.depth);
        gl.deleteFramebuffer(f.fbo);
      };
      del(this.hdr); del(this.ldr); del(this.bloomA); del(this.bloomB);
      this.hdr = root.GLU.makeFBO(gl, rw, rh, { float: this.floatOK, depth: true });
      this.ldr = root.GLU.makeFBO(gl, rw, rh, {});
      const bw = Math.max(8, rw >> 1), bh = Math.max(8, rh >> 1);
      this.bloomA = root.GLU.makeFBO(gl, bw, bh, { float: this.floatOK });
      this.bloomB = root.GLU.makeFBO(gl, bw, bh, { float: this.floatOK });
    },

    bindTex(unit, tex) {
      const gl = this.gl;
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, tex);
    },

    /** 阴影贴图矩阵：以房间中心为焦点的正交投影 */
    updateSun(scene) {
      const sun = scene.sun;
      const c = sun.focus;
      const eye = [c[0] + sun.dir[0] * 14, c[1] + sun.dir[1] * 14, c[2] + sun.dir[2] * 14];
      const v = M4.lookAt(M4.create(), eye, c, [0, 1, 0]);
      const p = M4.ortho(M4.create(), -sun.extent, sun.extent, -sun.extent, sun.extent, 0.5, 32);
      M4.mul(this.shadowVP, p, v);
    },

    drawNodes(nodes, prog, opts) {
      const gl = this.gl;
      const shadowPass = opts.shadowPass;
      const transparentPass = !!opts.transparent;
      for (const n of nodes) {
        if (!n.visible || !n.model) continue;
        if (shadowPass && n.noShadow) continue;
        prog.um4('uModel', n.world);
        if (!shadowPass) {
          M4.normalMat(this.nrm, n.world);
          prog.um3('uNrm', this.nrm);
          prog.u1f('uAlpha', n.alpha != null ? n.alpha : 1);
          prog.u1f('uEmisMul', n.emisMul != null ? n.emisMul : 1);
          const t = n.tint;
          prog.u3f('uTint', t ? t[0] : 0, t ? t[1] : 0, t ? t[2] : 0);
          prog.u1f('uTintStrength', n.tintStrength || 0);
        }
        for (const s of n.model.subs) {
          const isT = s.transparent || (n.alpha != null && n.alpha < 1);
          if (isT !== transparentPass && !shadowPass) continue;
          if (shadowPass && (s.transparent || s.noShadow || (n.alpha != null && n.alpha < 1))) continue;
          if (!shadowPass) {
            const t = root.TEX.get(s.tex);
            this.bindTex(0, t.albedo);
            prog.u1i('uHasNormal', t.normal ? 1 : 0);
            if (t.normal) this.bindTex(1, t.normal);
            prog.u1f('uAlpha', (n.alpha != null ? n.alpha : 1) * s.alpha);
          }
          gl.bindVertexArray(s.vao);
          gl.drawElements(gl.TRIANGLES, s.count, gl.UNSIGNED_INT, 0);
        }
      }
    },

    render(scene, cam, dt) {
      const gl = this.gl;
      const [rw, rh] = this.size;
      this.updateSun(scene);

      // ---- 阴影 Pass ----
      if (this.quality.shadows) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, this.shadow.fbo);
        gl.viewport(0, 0, this.shadow.size, this.shadow.size);
        gl.clear(gl.DEPTH_BUFFER_BIT);
        gl.colorMask(false, false, false, false);
        this.pDepth.use();
        this.pDepth.um4('uShadowVP', this.shadowVP);
        gl.cullFace(gl.FRONT);
        this.drawNodes(scene.nodes, this.pDepth, { shadowPass: true });
        gl.cullFace(gl.BACK);
        gl.colorMask(true, true, true, true);
      }

      // ---- 主 Pass ----
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.hdr.fbo);
      gl.viewport(0, 0, rw, rh);
      gl.clearColor(scene.fog.color[0] * 0.6, scene.fog.color[1] * 0.6, scene.fog.color[2] * 0.6, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      M4.perspective(this.proj, cam.fov * Math.PI / 180, rw / rh, 0.02, 60);
      M4.copy(this.view, cam.view);

      const p = this.pMain;
      p.use();
      p.um4('uProj', this.proj);
      p.um4('uView', this.view);
      p.u3v('uCamPos', cam.pos);
      const s = scene.sun;
      p.u3f('uSunDir', s.dir[0], s.dir[1], s.dir[2]);
      p.u3f('uSunColor', s.color[0], s.color[1], s.color[2]);
      p.u3f('uSkyColor', scene.ambient.sky[0], scene.ambient.sky[1], scene.ambient.sky[2]);
      p.u3f('uGroundColor', scene.ambient.ground[0], scene.ambient.ground[1], scene.ambient.ground[2]);
      p.u3f('uFogColor', scene.fog.color[0], scene.fog.color[1], scene.fog.color[2]);
      p.u1f('uFogDensity', scene.fog.density);
      p.um4('uShadowVP', this.shadowVP);
      p.u1i('uShadowOn', this.quality.shadows ? 1 : 0);
      p.u1f('uShadowTexel', 1 / this.shadow.size);
      p.u1i('uAlbedo', 0);
      p.u1i('uNormalTex', 1);
      p.u1i('uShadowMap', 2);
      this.bindTex(2, this.shadow.tex);

      // 低画质下只保留最近/最强的若干光源
      let lights = scene.lights.filter((l) => l.on !== false && l.intensity > 0);
      const maxL = Math.min(8, this.quality.maxLights || 8);
      if (lights.length > maxL) {
        const cp = cam.pos;
        lights = lights.slice().sort((a, b) => {
          const da = Math.hypot(a.pos[0] - cp[0], a.pos[1] - cp[1], a.pos[2] - cp[2]) / (a.intensity + 0.01);
          const db = Math.hypot(b.pos[0] - cp[0], b.pos[1] - cp[1], b.pos[2] - cp[2]) / (b.intensity + 0.01);
          return da - db;
        }).slice(0, maxL);
      }
      const lp = new Float32Array(32), lc = new Float32Array(32);
      lights.forEach((l, i) => {
        lp[i * 4] = l.pos[0]; lp[i * 4 + 1] = l.pos[1]; lp[i * 4 + 2] = l.pos[2]; lp[i * 4 + 3] = l.range;
        lc[i * 4] = l.color[0]; lc[i * 4 + 1] = l.color[1]; lc[i * 4 + 2] = l.color[2]; lc[i * 4 + 3] = l.intensity;
      });
      gl.uniform4fv(p.loc('uLightPos[0]'), lp);
      gl.uniform4fv(p.loc('uLightColor[0]'), lc);
      p.u1i('uLightCount', lights.length);

      gl.depthMask(true);
      gl.disable(gl.BLEND);
      this.drawNodes(scene.nodes, p, { transparent: false });

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.depthMask(false);
      this.drawNodes(scene.nodes, p, { transparent: true });
      gl.depthMask(true);
      gl.disable(gl.BLEND);

      // ---- 泛光 ----
      gl.disable(gl.DEPTH_TEST);
      gl.bindVertexArray(this.quad);
      if (this.quality.bloom) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, this.bloomA.fbo);
        gl.viewport(0, 0, this.bloomA.w, this.bloomA.h);
        this.pBright.use();
        this.pBright.u1i('uTex', 0);
        this.pBright.u1f('uThreshold', 1.05);
        this.bindTex(0, this.hdr.color);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        this.pBlur.use();
        this.pBlur.u1i('uTex', 0);
        for (let i = 0; i < 2; i++) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, this.bloomB.fbo);
          this.pBlur.u2f('uDir', 1.6 / this.bloomA.w, 0);
          this.bindTex(0, this.bloomA.color);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.bindFramebuffer(gl.FRAMEBUFFER, this.bloomA.fbo);
          this.pBlur.u2f('uDir', 0, 1.6 / this.bloomA.h);
          this.bindTex(0, this.bloomB.color);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
      }

      // ---- 合成 ----
      const target = this.quality.fxaa ? this.ldr.fbo : null;
      gl.bindFramebuffer(gl.FRAMEBUFFER, target);
      gl.viewport(0, 0, this.quality.fxaa ? rw : this.canvas.width, this.quality.fxaa ? rh : this.canvas.height);
      this.pComp.use();
      this.pComp.u1i('uScene', 0);
      this.pComp.u1i('uBloom', 1);
      this.bindTex(0, this.hdr.color);
      this.bindTex(1, this.quality.bloom ? this.bloomA.color : this.hdr.color);
      this.pComp.u1f('uBloomAmt', this.quality.bloom ? 0.55 : 0);
      this.pComp.u1f('uExposure', this.exposure);
      this.pComp.u1f('uVignette', 0.55);
      this.pComp.u1f('uTime', performance.now() * 0.001);
      this.pComp.u1f('uFlash', this.flash);
      this.pComp.u1f('uDesat', this.desat);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      if (this.quality.fxaa) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, this.canvas.width, this.canvas.height);
        this.pFxaa.use();
        this.pFxaa.u1i('uTex', 0);
        this.pFxaa.u2f('uInvRes', 1 / rw, 1 / rh);
        this.bindTex(0, this.ldr.color);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      gl.bindVertexArray(null);
      gl.enable(gl.DEPTH_TEST);
    },
  };

  root.RENDER = Renderer;
})(window);

/* 场景图：节点层级、世界矩阵、包围盒射线拾取 */
(function (root) {
  'use strict';

  const { M4, V3 } = root.MATH3D;

  let uid = 0;

  class Node {
    constructor(o) {
      o = o || {};
      this.id = ++uid;
      this.name = o.name || 'node';
      this.pos = (o.pos || [0, 0, 0]).slice();
      this.rot = (o.rot || [0, 0, 0]).slice();
      this.scale = (o.scale || [1, 1, 1]).slice();
      this.model = o.model || null;
      this.visible = o.visible !== false;
      this.alpha = o.alpha != null ? o.alpha : 1;
      this.emisMul = o.emisMul != null ? o.emisMul : 1;
      this.tint = null;
      this.tintStrength = 0;
      this.noShadow = !!o.noShadow;
      this.parent = null;
      this.children = [];
      this.matrixOverride = null;
      this.local = M4.create();
      this.world = M4.create();
      this.data = o.data || {};
      this.spin = null; // {axis, speed, angle} 风扇旋转
    }

    add(child) {
      if (child.parent) child.parent.remove(child);
      child.parent = this;
      this.children.push(child);
      if (this.scene) this.scene.markDirty();
      return child;
    }

    remove(child) {
      const i = this.children.indexOf(child);
      if (i >= 0) this.children.splice(i, 1);
      child.parent = null;
      if (this.scene) this.scene.markDirty();
    }

    /** 更换父节点并保持世界位置（用于把主板连零件一起装进机箱） */
    reparentKeepWorld(newParent) {
      const w = M4.copy(M4.create(), this.world);
      const inv = M4.invert(M4.create(), newParent.world);
      const local = M4.mul(M4.create(), inv, w);
      newParent.add(this);
      // 从矩阵反解平移；旋转沿用原值（本项目的父子变换均为轴对齐或已知角度）
      this.pos = [local[12], local[13], local[14]];
      return local;
    }

    updateWorld(parentWorld) {
      if (this.matrixOverride) {
        // 手持零件：世界矩阵直接由相机决定
        M4.copy(this.world, this.matrixOverride);
      } else {
        M4.fromTRS(this.local, this.pos, this.rot, this.scale);
        if (parentWorld) M4.mul(this.world, parentWorld, this.local);
        else M4.copy(this.world, this.local);
      }
      for (const c of this.children) c.updateWorld(this.world);
    }

    /** 世界空间轴对齐包围盒 */
    worldAABB() {
      if (!this.model) return null;
      const b = this.model.bbox;
      const min = [1e9, 1e9, 1e9], max = [-1e9, -1e9, -1e9];
      for (let i = 0; i < 8; i++) {
        const p = [
          i & 1 ? b.max[0] : b.min[0],
          i & 2 ? b.max[1] : b.min[1],
          i & 4 ? b.max[2] : b.min[2],
        ];
        const w = M4.xformPoint([0, 0, 0], this.world, p);
        for (let k = 0; k < 3; k++) {
          if (w[k] < min[k]) min[k] = w[k];
          if (w[k] > max[k]) max[k] = w[k];
        }
      }
      return { min, max };
    }

    worldPos() {
      return [this.world[12], this.world[13], this.world[14]];
    }
  }

  class Scene {
    constructor() {
      this.root = new Node({ name: 'root' });
      this.root.scene = this;
      this.nodes = [];
      this.dirty = true;
      this.lights = [];
      this.sun = {
        dir: V3.norm([0, 0, 0], [0.45, 0.72, 0.52]),
        color: [3.4, 3.1, 2.7],
        focus: [0, 1.0, 0],
        extent: 7.5,
      };
      this.ambient = { sky: [0.30, 0.34, 0.42], ground: [0.10, 0.09, 0.08] };
      this.fog = { color: [0.16, 0.17, 0.20], density: 0.012 };
    }

    markDirty() { this.dirty = true; }

    add(node, parent) {
      (parent || this.root).add(node);
      node.scene = this;
      this.markDirty();
      return node;
    }

    flatten() {
      this.nodes.length = 0;
      const walk = (n) => {
        n.scene = this;
        if (n !== this.root) this.nodes.push(n);
        for (const c of n.children) walk(c);
      };
      walk(this.root);
      this.dirty = false;
    }

    update(dt) {
      if (this.dirty) this.flatten();
      for (const n of this.nodes) {
        if (n.spin) {
          n.spin.angle = (n.spin.angle + n.spin.speed * dt) % (Math.PI * 2);
          n.rot[n.spin.axis] = n.spin.angle;
        }
      }
      this.root.updateWorld(null);
    }
  }

  /** 射线与 AABB 求交，返回命中距离或 null */
  function rayAABB(orig, dir, box) {
    let tmin = 0.0001, tmax = 1e9;
    for (let i = 0; i < 3; i++) {
      if (Math.abs(dir[i]) < 1e-8) {
        if (orig[i] < box.min[i] || orig[i] > box.max[i]) return null;
      } else {
        const inv = 1 / dir[i];
        let t1 = (box.min[i] - orig[i]) * inv;
        let t2 = (box.max[i] - orig[i]) * inv;
        if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
        tmin = Math.max(tmin, t1);
        tmax = Math.min(tmax, t2);
        if (tmin > tmax) return null;
      }
    }
    return tmin;
  }

  function aabbExpand(box, m) {
    return {
      min: [box.min[0] - m, box.min[1] - m, box.min[2] - m],
      max: [box.max[0] + m, box.max[1] + m, box.max[2] + m],
    };
  }

  root.SCENE = { Node, Scene, rayAABB, aabbExpand };
})(window);

/* 第一人称控制器：指针锁定视角、WASD 移动、碰撞、头部起伏 */
(function (root) {
  'use strict';

  const { M4, V3, clamp, damp } = root.MATH3D;

  const Input = {
    keys: Object.create(null),
    mouseDX: 0,
    mouseDY: 0,
    dragging: false,
    locked: false,
    wheel: 0,
    clicked: false,
    rightClicked: false,
    sensitivity: 1.0,
    invertY: false,
    blocked: false, // 弹窗打开时屏蔽移动

    init(canvas, onKey) {
      const isGameKey = (c) => /^(Key|Digit|Arrow|Numpad)/.test(c) || c === 'Space' || c === 'Tab' || c === 'ShiftLeft' || c === 'ShiftRight';
      window.addEventListener('keydown', (e) => {
        if (e.repeat) { if (onKey) onKey(e.code, e, true); return; }
        this.keys[e.code] = true;
        if (onKey) onKey(e.code, e, false);
        if (isGameKey(e.code)) e.preventDefault();
      });
      window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
      window.addEventListener('blur', () => { this.keys = Object.create(null); });

      document.addEventListener('pointerlockchange', () => {
        this.locked = document.pointerLockElement === canvas;
      });
      canvas.addEventListener('mousemove', (e) => {
        if (this.locked) {
          this.mouseDX += e.movementX;
          this.mouseDY += e.movementY;
        } else if (this.dragging) {
          this.mouseDX += e.movementX || 0;
          this.mouseDY += e.movementY || 0;
        }
      });
      canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) { this.dragging = true; this.clicked = true; }
        if (e.button === 2) this.rightClicked = true;
      });
      window.addEventListener('mouseup', () => { this.dragging = false; });
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      canvas.addEventListener('wheel', (e) => { this.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
    },

    consumeMouse() {
      const d = [this.mouseDX, this.mouseDY];
      this.mouseDX = 0; this.mouseDY = 0;
      return d;
    },

    down(code) { return !!this.keys[code]; },
  };

  class Player {
    constructor(pos, yaw) {
      this.pos = (pos || [0, 0, 3]).slice(); // 脚底位置
      this.vel = [0, 0, 0];
      this.yaw = yaw || 0;
      this.pitch = -0.05;
      this.eye = 1.66;
      this.crouch = 0;
      this.radius = 0.28;
      this.onGround = true;
      this.bob = 0;
      this.bobAmp = 0;
      this.view = M4.create();
      this.camPos = [0, 0, 0];
      this.fov = 72;
      this.fovTarget = 72;
      this.colliders = [];
      this.roll = 0;
    }

    forward() {
      const cp = Math.cos(this.pitch);
      return [-Math.sin(this.yaw) * cp, Math.sin(this.pitch), -Math.cos(this.yaw) * cp];
    }

    right() {
      return [Math.cos(this.yaw), 0, -Math.sin(this.yaw)];
    }

    hits(pos) {
      const r = this.radius;
      const h = 1.72 - this.crouch * 0.6;
      const box = {
        min: [pos[0] - r, pos[1] + 0.05, pos[2] - r],
        max: [pos[0] + r, pos[1] + h, pos[2] + r],
      };
      for (const c of this.colliders) {
        if (box.min[0] < c.max[0] && box.max[0] > c.min[0]
          && box.min[1] < c.max[1] && box.max[1] > c.min[1]
          && box.min[2] < c.max[2] && box.max[2] > c.min[2]) return true;
      }
      return false;
    }

    update(dt, opts) {
      const speedLook = 0.0022 * Input.sensitivity;
      const [dx, dy] = Input.consumeMouse();
      if (!Input.blocked) {
        this.yaw -= dx * speedLook;
        this.pitch -= (Input.invertY ? -dy : dy) * speedLook;
        // 方向键视角（无需鼠标锁定也可环视）
        const kLook = 2.3 * dt;
        if (Input.down('ArrowLeft')) this.yaw += kLook;
        if (Input.down('ArrowRight')) this.yaw -= kLook;
        if (Input.down('ArrowUp')) this.pitch += kLook * 0.85;
        if (Input.down('ArrowDown')) this.pitch -= kLook * 0.85;
      }
      this.pitch = clamp(this.pitch, -1.45, 1.45);

      let mx = 0, mz = 0;
      if (!Input.blocked && !(opts && opts.frozen)) {
        if (Input.down('KeyW')) mz += 1;
        if (Input.down('KeyS')) mz -= 1;
        if (Input.down('KeyA')) mx -= 1;
        if (Input.down('KeyD')) mx += 1;
      }
      const sprint = Input.down('ShiftLeft') || Input.down('ShiftRight');
      const crouching = Input.down('ControlLeft') || Input.down('KeyC');
      this.crouch = damp(this.crouch, crouching ? 1 : 0, 12, dt);

      const len = Math.hypot(mx, mz) || 1;
      const base = crouching ? 1.45 : sprint ? 4.15 : 2.5;
      const f = this.forward(), r = this.right();
      const wishX = (r[0] * mx + f[0] * mz) / len;
      const wishZ = (r[2] * mx + f[2] * mz) / len;
      const moving = mx !== 0 || mz !== 0;

      const accel = this.onGround ? 22 : 6;
      this.vel[0] = damp(this.vel[0], moving ? wishX * base : 0, accel, dt);
      this.vel[2] = damp(this.vel[2], moving ? wishZ * base : 0, accel, dt);

      if (!Input.blocked && Input.down('Space') && this.onGround) {
        this.vel[1] = 4.1;
        this.onGround = false;
      }
      this.vel[1] -= 11.5 * dt;

      const step = (axis, amount) => {
        if (!amount) return;
        const next = this.pos.slice();
        next[axis] += amount;
        if (!this.hits(next)) {
          this.pos = next;
        } else if (axis !== 1) {
          // 尝试沿台阶上抬
          const stepUp = next.slice();
          stepUp[1] += 0.32;
          if (!this.hits(stepUp)) this.pos = stepUp;
          else this.vel[axis] = 0;
        } else {
          if (amount < 0) { this.onGround = true; }
          this.vel[1] = 0;
        }
      };
      // 低帧率下把位移拆成小步，避免穿墙
      const move = [this.vel[0] * dt, this.vel[1] * dt, this.vel[2] * dt];
      const maxStep = 0.07;
      const sub = Math.min(8, Math.max(1, Math.ceil(Math.max(
        Math.abs(move[0]), Math.abs(move[1]), Math.abs(move[2])) / maxStep)));
      for (let i = 0; i < sub; i++) {
        step(0, move[0] / sub);
        step(2, move[2] / sub);
        step(1, move[1] / sub);
      }

      if (this.pos[1] <= 0) { this.pos[1] = 0; this.vel[1] = 0; this.onGround = true; }
      else if (this.vel[1] !== 0) this.onGround = false;

      const speed = Math.hypot(this.vel[0], this.vel[2]);
      this.bobAmp = damp(this.bobAmp, this.onGround ? Math.min(speed / 4.2, 1) : 0, 8, dt);
      this.bob += dt * (6.2 + speed * 1.5);
      this.fovTarget = 72 + (sprint && speed > 2 ? 5 : 0);
      this.fov = damp(this.fov, this.fovTarget, 6, dt);
      this.roll = damp(this.roll, -mx * 0.012, 8, dt);

      const eyeH = this.eye - this.crouch * 0.52
        + Math.sin(this.bob) * 0.028 * this.bobAmp;
      const sway = Math.cos(this.bob * 0.5) * 0.022 * this.bobAmp;
      this.camPos = [
        this.pos[0] + r[0] * sway,
        this.pos[1] + eyeH,
        this.pos[2] + r[2] * sway,
      ];
      const fwd = this.forward();
      const target = [this.camPos[0] + fwd[0], this.camPos[1] + fwd[1], this.camPos[2] + fwd[2]];
      const up = [Math.sin(this.roll), Math.cos(this.roll), 0];
      M4.lookAt(this.view, this.camPos, target, up);
    }
  }

  root.PLAYER = { Input, Player };

      const col = (opt && opt.color) || [0.06, 0.06, 0.07];
      const w = (opt && opt.w) || 0.05;
      mb.box(m(MAT.plastic, { at: [0, 0, 0], size: [w, 0.012, 0.014], color: col, rough: 0.4 }));
      for (let i = 0; i < (opt && opt.pins || 12); i++) {

      }
      const N = (opt && opt.strands) || 6;
      for (let i = 0; i < N; i++) {
        const t = (i / N - 0.5);
        mb.tube(m(MAT.rubber, {
          points: bezier([t * w * 0.8, 0, -0.008], [t * w, 0.02, -0.05], [t * w * 2, -0.03, -0.10], [t * w * 0.5, 0.01, -0.14], 12),
          r: 0.0026, sides: 6, color: (opt && opt.wire) || [0.05, 0.05, 0.06],
        }));
      }
    },

    /** 已安装的线束：由多段贝塞尔管道构成（机箱局部坐标） */
    cableRun(mb, opt) {
      const paths = opt.paths;
      for (const p of paths) {
        const pts = bezier(p.a, p.c1, p.c2, p.b, p.steps || 16);
        const strands = p.strands || 1;
        for (let s = 0; s < strands; s++) {
          const off = (s - (strands - 1) / 2) * (p.spread || 0.006);
          const shifted = pts.map((q, i) => [
            q[0] + off * (p.axis === 'x' ? 1 : 0),
            q[1] + off * (p.axis === 'y' ? 1 : 0),
            q[2] + off * (p.axis === 'z' || !p.axis ? 1 : 0),
          ]);
          mb.tube(m(MAT.rubber, { points: shifted, r: p.r || 0.0035, sides: 7, color: p.color || [0.05, 0.05, 0.06] }));
        }
        if (p.plugA) mb.box(m(MAT.plastic, { at: p.a, size: p.plugA, color: [0.09, 0.09, 0.10], rough: 0.4 }));
        if (p.plugB) mb.box(m(MAT.plastic, { at: p.b, size: p.plugB, color: [0.09, 0.09, 0.10], rough: 0.4 }));
      }
    },

    /** 发光小点（电源指示灯 / Debug LED） */
    ledDot(mb, opt) {
      opt = opt || {};
      mb.cyl(m(MAT.plasticWhite, {
        at: [0, 0, 0], axis: opt.axis || 'z', r: opt.r || 0.004, h: 0.002, segs: 12,
        color: opt.color || [0.4, 0.9, 1.0], emis: 1.0, rough: 0.2,
      }));
    },

    /** 主板 Debug LED 四连灯 */
    ledDots(mb) {

      for (let i = 0; i < 4; i++) {

          at: [0, -i * 0.006, 0], size: [0.0042, 0.0032, 0.0016], color: cols[i], emis: 1.0, rough: 0.2,
        }));
      }
    },

    /* ============ 拆下的挡板 / 其他 ============ */
    ioShield(mb) {
      mb.box(m(MAT.steel, { at: [0, 0, 0], size: [0.159, 0.045, 0.002], color: [0.5, 0.5, 0.55], rough: 0.35 }));

      }
    },
  };

  root.MODELS_HW = { HW, MB_L, labelTex };

    ctx.lineTo(x1 - Math.cos(a - 0.4) * s, y1 - Math.sin(a - 0.4) * s);

/* 模型注册表：按名称惰性构建并缓存网格 */
(function (root) {
  'use strict';

  const cache = new Map();
  let GL = null;

  function builders() {
    return Object.assign({}, root.MODELS_ROOM.BUILDERS, root.MODELS_HW.HW);
  }

  let ALL = null;

  root.MODELS = {
    init(gl) { GL = gl; ALL = builders(); cache.clear(); },
    has(name) { return !!(ALL && ALL[name]); },
    get(name, opts) {
      const key = name + (opts ? '|' + JSON.stringify(opts) : '');
      if (cache.has(key)) return cache.get(key);
      const fn = ALL[name];
      if (!fn) throw new Error('未知模型: ' + name);
      const mb = new root.GEOM.MB();
      fn(mb, opts);
      const model = mb.build(GL);
      cache.set(key, model);
      return model;
    },
    stats() {
      let tris = 0;
      for (const mdl of cache.values()) for (const s of mdl.subs) tris += s.count / 3;
      return { models: cache.size, tris };
    },
  };
})(window);

    add('crate1', M('crate'), [-3.60, 0, 2.55], [0, 0.3, 0]);
    add('crate2', M('crate'), [-3.05, 0, 2.80], [0, -0.2, 0]);
    add('crate3', M('crate'), [-3.55, 0.4, 2.55], [0, 0.9, 0]);
    add('toolbox', M('toolbox'), [-0.95, 0.95, -2.98], [0, 0.15, 0]);

    add('clock', M('clock'), [3.55, 2.25, -3.33], [0, 0, 0]);

    /* ---------- 墙面教学海报 ---------- */
    add('posterFlow', M('poster', { tex: 'label:posterFlow', w: 0.62, h: 0.88 }), [-2.05, 1.78, -3.33]);

    add('whiteboard', M('poster', { tex: 'label:whiteboard', w: 1.00, h: 0.70 }), [-0.55, 1.80, -3.33]);
    add('posterStatic', M('poster', { tex: 'label:posterStatic', w: 0.46, h: 0.62 }), [-4.13, 1.55, -1.40], [0, PI / 2, 0]);
    add('sign', M('poster', { tex: 'label:shopSign', w: 1.10, h: 0.32 }), [2.50, 2.55, 3.33], [0, PI, 0]);

    /* ---------- 外设 ---------- */
    add('monitor', M('monitor'), W.monitorPos);
    add('keyboard', M('keyboard'), [2.85, 0.752, -2.80], [0, 0.02, 0]);
    add('mouse', M('mouse'), [3.28, 0.752, -2.82], [0, -0.1, 0]);
    const screen = add('screen', M('screen', { tex: 'dyn:monitor' }),
      [W.monitorPos[0], W.monitorPos[1] + 0.50, W.monitorPos[2] + 0.004]);
    screen.emisMul = 0;
    world.nodes.screen = screen;

    /* ---------- 爷爷的装机手记 ---------- */
    const notebook = add('notebook', M('notebook'), [-0.52, 0.952, -2.72], [0, 0.4, 0]);
    notebook.data.interact = { type: 'notebook', label: '爷爷的《装机手记》', key: 'E' };
    world.nodes.notebook = notebook;

    world.nodes.case = caseNode;
    // 电源指示灯（前面板）
    const powerLed = new Node({
      name: 'powerLed', model: M('ledDot', { color: [0.45, 0.85, 1.0], axis: 'x', r: 0.004 }),
      pos: [0.2415, 0.43, 0.04],
    });
    powerLed.emisMul = 0;
    caseNode.add(powerLed);
    world.nodes.powerLed = powerLed;
    caseNode.data.interact = { type: 'power', label: '按下电源键', key: 'E', pos: [0.245, 0.43, 0.04] };

    /* ---------- 灯光 ---------- */
    scene.sun.dir = root.MATH3D.V3.norm([0, 0, 0], [0.80, 0.52, 0.14]);
    scene.sun.color = [3.1, 2.85, 2.5];
    scene.sun.focus = [-0.4, 1.1, -2.0];
    scene.sun.extent = 3.6;
    scene.lights.push({ pos: [-1.20, 2.62, -1.10], color: [1.0, 0.96, 0.90], intensity: 13, range: 9 });
    scene.lights.push({ pos: [1.60, 2.62, 0.60], color: [1.0, 0.96, 0.90], intensity: 12, range: 9 });
    scene.lights.push({ pos: [-1.30, 2.10, -2.45], color: [1.0, 0.97, 0.92], intensity: 6, range: 4.5 });
    scene.lights.push({ pos: [0.80, 1.95, -2.35], color: [1.0, 0.97, 0.94], intensity: 5, range: 3.6 });
    const lampLight = { pos: [-2.32, 1.34, -2.76], color: [1.0, 0.86, 0.62], intensity: 2.2, range: 3.0 };
    scene.lights.push(lampLight);
    const screenLight = { pos: [2.90, 1.25, -2.92], color: [0.55, 0.72, 1.0], intensity: 0, range: 2.6 };
    scene.lights.push(screenLight);
    const rgbLight = { pos: [0.80, 1.16, -2.84], color: [0.50, 0.72, 1.0], intensity: 0, range: 1.6 };

    const box = (x0, y0, z0, x1, y1, z1) => ({ min: [x0, y0, z0], max: [x1, y1, z1] });
    world.colliders.push(

    for (const def of root.PARTS_DB.PARTS) {
      const node = new Node({
        name: 'part:' + def.id,
        model: M(def.model, def.modelOpts),
        pos: def.shelf.slice(),
        rot: (def.shelfRot || [0, 0, 0]).slice(),
      });
      if (def.id === 'ram1' || def.id === 'ram2' || def.id === 'gpu'
        || def.kind === 'fan') node.emisMul = 0;
      scene.add(node);
      const children = [];
      for (const c of (def.children || [])) {
        const cn = new Node({ name: 'sub', model: M(c.model), pos: c.pos.slice(), rot: c.rot.slice() });
        if (c.spin != null) {
          cn.spin = { axis: c.spin, speed: 0, angle: Math.random() * 6 };
          world.rotors.push(cn);
        }
        node.add(cn);
        children.push(cn);
      }
      const part = { def, node, children, state: 'shelf', inspected: false };
      world.parts[def.id] = part;

      // 货架标签牌
      if (def.shelf[0] < -3.5) {
        root.LABELS.partPlate(def.name, def.cat + ' · ' + (def.full || ''));
        const plate = add('plate:' + def.id,
          M('plate', { tex: 'label:plate:' + def.name, w: 0.14, h: 0.035 }),

/* ==================== src/14-audio.js ==================== */
/* 程序化音效：卡扣、螺丝、风扇、POST 蜂鸣与环境底噪（WebAudio，无外部资源） */
(function (root) {
  'use strict';

  const A = {
    ready: false,
    muted: false,

    init() {
      if (this.ready) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      this.ctx = new Ctx();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      this.noiseBuf = this.makeNoise(2.0);
      this.ready = true;
      this.ambient();
    },

    resume() {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },

    makeNoise(sec) {
      const n = Math.floor(this.ctx.sampleRate * sec);
      const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    },

    /** 环境：房间底噪 + 可变风扇声 */
    ambient() {
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      src.loop = true;
      const lp = this.ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 380;
      const g = this.ctx.createGain();
      g.gain.value = 0.022;
      src.connect(lp); lp.connect(g); g.connect(this.master);
      src.start();
      this.roomNoise = g;

      const fsrc = this.ctx.createBufferSource();
      fsrc.buffer = this.noiseBuf;
      fsrc.loop = true;
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 700;
      bp.Q.value = 0.9;
      const fg = this.ctx.createGain();
      fg.gain.value = 0;
      fsrc.connect(bp); bp.connect(fg); fg.connect(this.master);
      fsrc.start();
      this.fanGain = fg;
      this.fanFilter = bp;
    },

    setFans(level) {
      if (!this.ready) return;
      const t = this.ctx.currentTime;
      this.fanGain.gain.cancelScheduledValues(t);
      this.fanGain.gain.linearRampToValueAtTime(level * 0.09, t + 0.6);
      this.fanFilter.frequency.linearRampToValueAtTime(420 + level * 620, t + 0.6);
    },

    tone(freq, dur, type, gain, slide) {
      if (!this.ready || this.muted) return;
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain || 0.18, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    },

    burst(dur, freq, q, gain, type) {
      if (!this.ready || this.muted) return;
      const t = this.ctx.currentTime;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuf;
      const f = this.ctx.createBiquadFilter();
      f.type = type || 'bandpass';
      f.frequency.value = freq;
      f.Q.value = q || 1.2;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(gain || 0.25, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t, Math.random(), dur + 0.05);
    },

    play(name) {
      if (!this.ready || this.muted) return;
      switch (name) {
        case 'click': this.burst(0.05, 2600, 3, 0.28); this.tone(880, 0.05, 'square', 0.05); break;
        case 'seat': this.burst(0.11, 1200, 1.6, 0.30); this.tone(180, 0.12, 'sine', 0.10, 120); break;
        case 'screw': for (let i = 0; i < 4; i++) setTimeout(() => this.burst(0.035, 3200, 5, 0.16), i * 70); break;
        case 'squeeze': this.burst(0.28, 520, 0.7, 0.10, 'lowpass'); break;
        case 'pickup': this.burst(0.06, 1800, 2.5, 0.16); break;
        case 'deny': this.tone(220, 0.14, 'sawtooth', 0.10, 150); break;
        case 'ok': this.tone(660, 0.09, 'triangle', 0.12); setTimeout(() => this.tone(990, 0.12, 'triangle', 0.12), 90); break;
        case 'card': this.tone(1320, 0.06, 'sine', 0.07); break;
        case 'beep': this.tone(1046, 0.28, 'square', 0.14); break;
        case 'relay': this.burst(0.05, 320, 1.0, 0.35, 'lowpass'); break;
        case 'boot':
          this.tone(392, 0.18, 'triangle', 0.10);
          setTimeout(() => this.tone(523, 0.18, 'triangle', 0.10), 170);
          setTimeout(() => this.tone(659, 0.30, 'triangle', 0.12), 340);
          break;
        case 'win':
          [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.35, 'triangle', 0.11), i * 150));
          break;
        default: break;
      }
    },

    step() {
      if (!this.ready || this.muted) return;
      this.burst(0.07, 220 + Math.random() * 120, 0.8, 0.05, 'lowpass');
    },
  };

  root.AUDIO = A;
})(window);

  const $ = (id) => document.getElementById(id);

  const UI = {
    modalOpen: null,

      this.perfEl = $('perf');
      this.objChapter = $('objChapter');
      this.objTask = $('objTask');
      this.objHint = $('objHint');
      this.objBar = $('objBar');
      this.objCount = $('objCount');
      this.compassEl = $('compass');
      this.dialogueEl = $('dialogue');
      this.dialogueWho = $('dialogueWho');
      this.dialogueText = $('dialogueText');

      $('btnHelp').addEventListener('click', () => this.showHelp());
      $('btnSettings').addEventListener('click', () => this.showSettings());

      this.modal.addEventListener('click', (e) => { if (e.target === this.modal) this.closeModal(); });
    },

    /* ---------------- HUD ---------------- */
    setPrompt(html) {
      if (!html) { this.prompt.classList.add('hidden'); return; }
      this.prompt.classList.remove('hidden');
      this.prompt.innerHTML = html;
    },

    setHeld(name, sub) {
      if (!name) { this.held.classList.add('hidden'); return; }
      this.held.classList.remove('hidden');
      this.held.innerHTML = '<span class="k">手持</span>' + name
        + (sub ? '<span class="s">' + sub + '</span>' : '');
    },

    setObjective(chapter, task, hint, done, total) {
      this.objChapter.textContent = chapter;
      this.objTask.innerHTML = task;
      this.objHint.innerHTML = hint || '';
      const p = total ? (done / total * 100) : 0;
      this.objBar.style.width = p.toFixed(1) + '%';
      this.objCount.textContent = done + ' / ' + total;
    },

    compass(visible, screenX, dist, label) {

      this.compassEl.innerHTML = '<div class="arrow"></div><div class="lbl">' + label

    },

    toast(text, kind) {
      const t = el('div', 'toast ' + (kind || 'info'), text);
      this.toasts.appendChild(t);
      while (this.toasts.children.length > 4) this.toasts.firstChild.remove();
      setTimeout(() => t.classList.add('in'), 10);
      setTimeout(() => {
        t.classList.remove('in');
        setTimeout(() => t.remove(), 400);
      }, kind === 'warn' ? 6200 : 3600);
    },

    perf(fps, tris, extra) {
      this.perfEl.innerHTML = fps.toFixed(0) + ' FPS · ' + (tris / 1000).toFixed(0) + 'k 三角面'

      if (this.modalOpen) {
        this.pendingDialogue = { lines, onDone };
        return;
      }
      this.dialogueQueue = lines.slice();
      this.dialogueDone = onDone;
      this.dialogueEl.classList.remove('hidden');
      this.block(true);
      this.advanceDialogue(true);
    },

    advanceDialogue(first) {
      if (!this.dialogueQueue) return;
      if (!first) this.dialogueQueue.shift();
      if (!this.dialogueQueue.length) {
        this.dialogueEl.classList.add('hidden');
        this.dialogueQueue = null;
        this.block(false);
        const d = this.dialogueDone;
        this.dialogueDone = null;
        if (d) d();
        return;
      }
      const l = this.dialogueQueue[0];
      this.dialogueWho.textContent = l.who || '';
      this.dialogueWho.style.color = l.color || '#7fd2ff';
      this.dialogueText.innerHTML = l.text;

    closeModal() {
      if (!this.modalOpen) return;
      this.modal.classList.add('hidden');
      const cb = this.onModalClose;
      this.onModalClose = null;
      this.modalOpen = null;
      this.block(false);
      if (cb) cb();
      if (this.pendingDialogue) {

        return '<div class="chap"><h3>' + (c.done ? '✔ ' : '') + c.title + '</h3><ul>' + items + '</ul></div>';
      }).join('');

    biosPanel(state, onToggle, onSave) {

    report(stats, onRestart) {

            const sens = body.querySelector('#setSens');

              root.PLAYER.Input.sensitivity = parseInt(sens.value, 10) / 100;
              body.querySelector('#setSensV').textContent = root.PLAYER.Input.sensitivity.toFixed(1) + '×';
            });
            const toggle = (id, get, set) => {
              const b = body.querySelector(id);
              b.addEventListener('click', () => {
                set(!get());
                b.textContent = get() ? '开' : '关';
                this.game.onResize();
              });
            };
            toggle('#setShadow', () => q.shadows, (v) => { q.shadows = v; });
            toggle('#setBloom', () => q.bloom, (v) => { q.bloom = v; });
            toggle('#setFxaa', () => q.fxaa, (v) => { q.fxaa = v; });
            const mb = body.querySelector('#setMute');
            mb.addEventListener('click', () => {
              root.AUDIO.muted = !root.AUDIO.muted;
              root.AUDIO.setFans(root.AUDIO.muted ? 0 : (this.game.fanLevel || 0));
              mb.textContent = root.AUDIO.muted ? '静音' : '开';
            });
          },
        });
    },

    pauseMenu(onResume, onRestart) {
      this.openModal(
        '<div class="card-head"><span class="tag">暂停</span><h2>星海电脑维修部</h2></div>'
        + '<p class="body">随时可以回到工位继续装机。</p>'

        + '<button class="btn" id="pHelp">操作说明</button>'
        + '<button class="btn" id="pSet">设置</button>'

            body.querySelector('#pSet').addEventListener('click', () => { this.closeModal(); this.showSettings(); });
            body.querySelector('#pRestart').addEventListener('click', () => onRestart());
          },
        });
    },

    hideTitle() { $('title').classList.add('gone'); },
    showLoading(text) { $('loadingText').textContent = text; },
    hideLoading() { $('loading').classList.add('gone'); },
    fatal(msg) {
      $('loading').classList.remove('gone');
      $('loadingText').innerHTML = '<b style="color:#ff8a6a">出错了</b><br><br>' + msg;
    },
  };

  root.UI = UI;
})(window);
